[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logwatch"
version = "0.1.0"
description = "Mini attack detection engine for auth and web logs, mapped to MITRE ATT&CK"
requires-python = ">=3.10"
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "bandit"]

[project.scripts]
logwatch = "logwatch.cli:main"

[tool.setuptools.packages.find]
include = ["logwatch"]

[tool.setuptools.package-data]
logwatch = ["templates/*.j2"]

[tool.ruff]
line-length = 100